<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:x-transition="http://www.w3.org/1999/xhtml" lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANCH - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        [x-cloak] {
            display: none !important;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-image:
                    radial-gradient(circle at 15% 20%, rgba(74, 13, 24, 0.85) 0%, rgba(30, 9, 16, 0.90) 40%, rgba(38, 22, 9, 0.92) 75%, rgba(18, 6, 10, 0.95) 100%),
                    url("https://t4.ftcdn.net/jpg/04/16/60/67/240_F_416606730_Z0azZ04ANOjTD0SlpgbMW761u3kugaL5.jpg");
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased text-amber-50 selection:bg-rose-900 selection:text-white relative overflow-x-hidden">

<!-- Ambient Soft Lighting Bubbles (Burgundy & Warm Honey) -->
<div class="absolute -top-32 -left-32 w-[34rem] h-[34rem] bg-rose-800/25 rounded-full blur-[130px] pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-[34rem] h-[34rem] bg-amber-600/15 rounded-full blur-[130px] pointer-events-none"></div>

<header class="sticky top-0 z-40 w-full border-b border-rose-900/40 bg-stone-950/70 backdrop-blur-2xl transition-all">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <!-- Brand Logo -->
        <div class="flex items-center gap-3">
            <span class="text-xl font-black tracking-widest uppercase bg-gradient-to-r from-amber-100 via-rose-100 to-amber-300 bg-clip-text text-transparent">
                WANCH
            </span>
        </div>

        <!-- Navigation Links & Actions -->
        <div class="flex items-center gap-3">
            <div x-data="{ openDropdown: null }" class="flex items-center gap-3 relative">

                <!-- 1. WINE BUTTON & DROPDOWN -->
                <div class="relative" @click.outside="if (openDropdown === 'wine') openDropdown = null">
                    <button @click="openDropdown = (openDropdown === 'wine' ? null : 'wine')"
                            type="button"
                            class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-gradient-to-r from-rose-800 to-rose-700 hover:from-rose-700 hover:to-rose-600 active:from-rose-900 active:to-rose-800 text-white font-medium text-xs rounded-full transition-all duration-200 shadow-md shadow-rose-950/60 border border-rose-500/40 cursor-pointer">
                        <span>Choose Wine</span>
                        <svg class="w-3 h-3 text-rose-200 transition-transform duration-200"
                             :class="{ 'rotate-180': openDropdown === 'wine' }"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <!-- Wine Dropdown Menu (Expanded to w-64 for better fitting) -->
                    <div x-show="openDropdown === 'wine'"
                         x-cloak
                         x-transition:enter="transition ease-out duration-200"
                         x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                         x-transition:leave="transition ease-in duration-150"
                         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                         x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
                         class="absolute left-0 mt-2 w-64 bg-stone-950/95 border border-rose-900/50 rounded-xl shadow-xl shadow-black/80 backdrop-blur-md p-2 z-50">

                        <!-- Empty Wine State -->
                        <div th:if="${allWinesInStore == null or #lists.isEmpty(allWinesInStore)}" class="text-center py-6 space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-stone-900 text-rose-200/40 flex items-center justify-center mx-auto border border-rose-900/30 text-lg">
                                🍷
                            </div>
                            <p class="text-xs font-semibold text-amber-200/60">No wines in database.</p>
                        </div>

                        <!-- Wine List -->
                        <div th:if="${allWinesInStore != null and !#lists.isEmpty(allWinesInStore)}" class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                            <a th:each="wine : ${allWinesInStore}"
                               th:href="@{/search(wineId=${wine.id})}"
                               class="p-2.5 bg-stone-900/80 hover:bg-rose-950/40 rounded-lg border border-rose-900/30 flex items-center justify-between transition-colors group">
                    <span class="text-xs font-semibold text-amber-100 group-hover:text-rose-200 truncate"
                          th:text="${wine.wineName != null ? wine.wineName : 'Anonymous Wine'}">Wine Name</span>
                                <span class="text-[10px] text-rose-300/80 font-medium px-1.5 py-0.5 rounded bg-rose-950/60 border border-rose-800/40 shrink-0 ml-2"
                                      th:text="${wine.winetype}">Type</span>
                            </a>
                        </div>
                    </div>
                </div>


                <!-- 2. CHEESE BUTTON & DROPDOWN -->
                <div class="relative" @click.outside="if (openDropdown === 'cheese') openDropdown = null">
                    <button @click="openDropdown = (openDropdown === 'cheese' ? null : 'cheese')"
                            type="button"
                            class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-amber-950/40 hover:bg-amber-900/50 active:bg-amber-950 text-amber-100 font-medium text-xs rounded-full transition-all duration-200 border border-amber-800/50 hover:border-amber-700/70 shadow-sm backdrop-blur-sm cursor-pointer">
                        <span>Choose Cheese</span>
                        <svg class="w-3 h-3 text-amber-300 transition-transform duration-200"
                             :class="{ 'rotate-180': openDropdown === 'cheese' }"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <!-- Cheese Dropdown Menu -->
                    <div x-show="openDropdown === 'cheese'"
                         x-cloak
                         x-transition:enter="transition ease-out duration-200"
                         x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                         x-transition:leave="transition ease-in duration-150"
                         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                         x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
                         class="absolute left-0 mt-2 w-56 bg-stone-950/95 border border-amber-900/50 rounded-xl shadow-xl shadow-black/80 backdrop-blur-md p-2 z-50">

                        <!-- Empty Cheese State -->
                        <div th:if="${allCheeseInStore == null or #lists.isEmpty(allCheeseInStore)}" class="text-center py-6 space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-stone-900 text-amber-200/40 flex items-center justify-center mx-auto border border-amber-900/30 text-lg">
                                🧀
                            </div>
                            <p class="text-xs font-semibold text-amber-200/60">No cheese in database.</p>
                        </div>

                        <!-- Cheese List -->
                        <div th:if="${allCheeseInStore != null and !#lists.isEmpty(allCheeseInStore)}" class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                            <a th:each="cheese : ${allCheeseInStore}"
                               th:href="@{/search(cheeseId=${cheese.id})}"
                               class="p-2.5 bg-stone-900/80 hover:bg-amber-950/40 rounded-lg border border-amber-900/30 flex items-center justify-between transition-colors group">
                    <span class="text-xs font-semibold text-amber-100 group-hover:text-amber-300 truncate"
                          th:text="${cheese.cheeseName != null ? cheese.cheeseName : 'Anonymous Cheese'}">Cheese Name</span>
                                <span class="text-[10px]">🧀</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Sign Out -->
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit"
                        class="px-3.5 py-1.5 bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 text-xs font-medium rounded-full transition border border-rose-800/50 hover:border-rose-700/70 shadow-sm">
                    Sign Out
                </button>
            </form>
        </div>
    </div>
</header>
<main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <!-- 2. HERO WELCOME BANNER (Wanch Sommelier Theme) -->
    <div class="relative overflow-hidden rounded-2xl bg-stone-950/70 backdrop-blur-2xl p-6 sm:p-8 border border-rose-900/40 shadow-2xl shadow-stone-950/80">
        <!-- Ambient Radial Glows -->
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-rose-800/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-amber-50">
                    Welcome back, <span class="bg-gradient-to-r from-amber-100 via-rose-200 to-amber-300 bg-clip-text text-transparent" th:text="${company.companyName}">companyName</span>
                </h1>
                <p class="text-amber-200/60 text-sm mt-1.5 max-w-xl">
                    Plan your wine and cheese events.
                </p>
            </div>
            <button onclick="openEventModal()"
                    class="px-4 py-2.5 bg-gradient-to-r from-rose-800 to-rose-700 hover:from-rose-700 hover:to-rose-600 active:from-rose-900 active:to-rose-800 text-white font-medium text-xs rounded-full transition-all duration-200 shadow-lg shadow-rose-950/60 border border-rose-500/40 shrink-0 flex items-center gap-2">
                <span class="text-base font-bold leading-none text-amber-200">+</span> Create Event
            </button>
        </div>
    </div>
    <a th:href="@{/events(companyId=${company.id})}"
       class="group relative block overflow-hidden rounded-3xl bg-stone-950/70 backdrop-blur-2xl p-8 sm:p-10 border border-rose-900/40 hover:border-rose-700/60 transition-all duration-300 shadow-2xl shadow-stone-950/80 hover:shadow-rose-950/50 hover:-translate-y-1">

        <!-- Ambient Wine & Amber Glow Effect (Expands on Hover) -->
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-rose-800/25 rounded-full blur-3xl group-hover:bg-rose-700/35 transition-all duration-500 pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-amber-600/15 rounded-full blur-3xl group-hover:bg-amber-600/25 transition-all duration-500 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col justify-between h-full min-h-[220px] space-y-6">

            <!-- Header Badge & Icon -->
            <div class="flex items-center justify-between">
            <span class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-rose-950/80 border border-rose-700/50 text-rose-200 text-[11px] font-bold tracking-widest uppercase shadow-sm">
                <span>🍷</span>
                <span>Curation Engine</span>
                <span>🧀</span>
            </span>

                <!-- Arrow Indicator -->
                <div class="w-10 h-10 rounded-full bg-stone-900/80 border border-amber-900/40 text-amber-200 group-hover:text-white group-hover:bg-rose-800 group-hover:border-rose-600 flex items-center justify-center transition-all duration-300 shadow-sm shrink-0">
                    <svg class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </div>
            </div>

            <!-- Title & Subtitle -->
            <div class="space-y-2">
                <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight uppercase bg-gradient-to-r from-amber-100 via-rose-100 to-amber-300 bg-clip-text text-transparent group-hover:from-white group-hover:to-rose-200 transition-all">
                    Events
                </h2>
                <p class="text-amber-200/60 text-xs sm:text-sm font-medium leading-relaxed max-w-sm">
                    Manage, schedule, and review company wine & cheese tastings.
                </p>
            </div>

        </div>
    </a>


</main>


<!-- Create Event Modal -->
<div id="event-modal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
    <div class="bg-stone-950/90 border border-rose-900/40 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl shadow-stone-950/80 space-y-5">

        <!-- Header -->
        <div class="flex justify-between items-center border-b border-rose-900/30 pb-3">
            <h3 class="text-base font-bold text-amber-100">Create an Event</h3>
            <button type="button" onclick="closeEventModal()" class="text-amber-200/60 hover:text-amber-100 font-bold text-lg">&times;</button>
        </div>

        <!-- Form mapped to /events -->
        <form th:action="@{/createEvent}" method="post" class="space-y-4">

            <!-- Event Name -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-200/80 mb-1.5">Event Name</label>
                <input type="text" name="eventName" required placeholder="Your Event Name"
                       class="w-full bg-stone-900/80 border border-amber-900/40 rounded-xl px-3.5 py-2.5 text-amber-100 text-sm placeholder-amber-200/30 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition">
            </div>

            <!-- Event Date Calendar Picker -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-200/80 mb-1.5">Event Date</label>
                <input type="date" name="date" required
                       class="w-full bg-stone-900/80 border border-amber-900/40 rounded-xl px-3.5 py-2.5 text-amber-100 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition [color-scheme:dark]">
            </div>

            <!-- Select Wine (Hold Ctrl/Cmd for multiple) -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-200/80 mb-1.5">Select Wines</label>
                <select name="wines" multiple required class="w-full bg-stone-900/80 border border-amber-900/40 rounded-xl px-3.5 py-2.5 text-amber-100 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition h-24">
                    <option th:each="wine : ${allWinesInStore}" th:value="${wine.id}" th:text="${wine.wineName} + ' - ' + ${wine.winetype}">Wine Name - Wine Type</option>
                </select>
            </div>

            <!-- Select Cheese (Hold Ctrl/Cmd for multiple) -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-200/80 mb-1.5">Select Cheeses</label>
                <select name="cheeses" multiple required class="w-full bg-stone-900/80 border border-amber-900/40 rounded-xl px-3.5 py-2.5 text-amber-100 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition h-24">
                    <option th:each="cheese : ${allCheeseInStore}" th:value="${cheese.id}" th:text="${cheese.cheeseName}">Cheese Name</option>
                </select>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end space-x-3 pt-3 border-t border-rose-900/30">
                <button type="button" onclick="closeEventModal()" class="px-4 py-2 bg-amber-950/40 hover:bg-amber-900/50 text-amber-200 text-xs font-semibold rounded-full border border-amber-800/40 transition">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-gradient-to-r from-rose-800 to-rose-700 hover:from-rose-700 hover:to-rose-600 text-white text-xs font-semibold rounded-full shadow-lg shadow-rose-950/60 border border-rose-500/40 transition">Create Event</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openEventModal(){
        document.getElementById('event-modal').classList.remove('hidden');
    }
    function closeEventModal(){
        document.getElementById('event-modal').classList.add('hidden');
    }
</script>
</body>
</html>
