<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANCH - Log In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Blend of deep red wine, warm cheese gold, and dark plum/violet */
            background: radial-gradient(circle at 15% 20%, #4a0d18 0%, #1e0910 40%, #261609 75%, #12060a 100%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans antialiased text-amber-50 selection:bg-rose-900 selection:text-white relative overflow-hidden">

<!-- Ambient Soft Lighting Bubbles (Burgundy & Warm Honey) -->
<div class="absolute -top-32 -left-32 w-[34rem] h-[34rem] bg-rose-800/25 rounded-full blur-[130px] pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-[34rem] h-[34rem] bg-amber-600/15 rounded-full blur-[130px] pointer-events-none"></div>

<!-- MAIN CARD CONTAINER -->
<div class="relative z-10 w-full max-w-md bg-stone-950/70 backdrop-blur-2xl p-8 sm:p-10 rounded-3xl border border-rose-900/40 shadow-2xl shadow-stone-950/80 space-y-6">

    <!-- BRAND HEADER -->
    <div class="text-center space-y-2">
        <a th:href="@{/}" class="inline-block group">
            <span class="text-3xl font-black tracking-widest uppercase bg-gradient-to-r from-amber-100 via-rose-100 to-amber-300 bg-clip-text text-transparent">
                WANCH
            </span>
        </a>
        <p class="text-amber-200/60 text-xs">Enter your credentials to access your company portal.</p>
    </div>

    <!-- NOTIFICATION ALERTS -->

    <!-- Error Alert -->
    <div th:if="${param.error}" class="bg-rose-950/80 border border-rose-800/60 text-rose-200 p-3.5 rounded-xl text-xs font-medium text-center backdrop-blur-sm flex items-center justify-center gap-2 shadow-sm">
        <svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>Invalid company name or password.</span>
    </div>

    <!-- Logout Alert -->
    <div th:if="${param.logout}" class="bg-amber-950/60 border border-amber-800/50 text-amber-200 p-3.5 rounded-xl text-xs font-medium text-center backdrop-blur-sm flex items-center justify-center gap-2 shadow-sm">
        <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>You have been logged out successfully.</span>
    </div>

    <!-- Registration Success Alert -->
    <div th:if="${param.registered}" class="bg-rose-950/60 border border-rose-700/60 text-amber-100 p-3.5 rounded-xl text-xs font-medium text-center backdrop-blur-sm flex items-center justify-center gap-2 shadow-sm">
        <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span>Account created successfully! Please sign in.</span>
    </div>

    <!-- FORM SECTION -->
    <form th:action="@{/login}" method="post" class="space-y-5">
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-amber-200/80 mb-2">Company Name</label>
            <input type="text" name="companyName" required placeholder="Enter company name"
                   class="w-full px-4 py-3 bg-stone-900/80 border border-amber-900/40 text-amber-100 rounded-xl text-sm placeholder-amber-200/30 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all duration-200 backdrop-blur-sm">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-amber-200/80 mb-2">Password</label>
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full px-4 py-3 bg-stone-900/80 border border-amber-900/40 text-amber-100 rounded-xl text-sm placeholder-amber-200/30 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all duration-200 backdrop-blur-sm">
        </div>

        <button type="submit"
                class="w-full py-3.5 bg-gradient-to-r from-rose-800 to-rose-700 hover:from-rose-700 hover:to-rose-600 active:from-rose-900 active:to-rose-800 text-white text-xs font-bold uppercase tracking-widest rounded-full shadow-lg shadow-rose-950/60 hover:shadow-rose-900/80 transition-all duration-200 border border-rose-500/40">
            Log In
        </button>
    </form>

    <!-- FOOTER NAV -->
    <div class="pt-4 text-center border-t border-rose-900/30">
        <p class="text-xs text-amber-200/60">
            Don't have an account?
            <a th:href="@{/register}" class="text-rose-400 hover:text-rose-300 font-semibold hover:underline transition">Register Company</a>
        </p>
    </div>

</div>

</body>
</html>
