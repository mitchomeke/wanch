<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event != null ? 'Pairings for ' + event.eventName : 'Event Pairings'}">Event Pairings</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image:
                    radial-gradient(circle at 15% 20%, rgba(74, 13, 24, 0.85) 0%, rgba(30, 9, 16, 0.90) 40%, rgba(38, 22, 9, 0.92) 75%, rgba(18, 6, 10, 0.95) 100%),
                    url("https://t4.ftcdn.net/jpg/04/16/60/67/240_F_416606730_Z0azZ04ANOjTD0SlpgbMW761u3kugaL5.jpg");
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased text-amber-50 selection:bg-rose-900 selection:text-white relative overflow-x-hidden">

<!-- Ambient Soft Lighting Bubbles (Burgundy & Warm Honey) -->
<div class="absolute -top-32 -left-32 w-[34rem] h-[34rem] bg-rose-800/25 rounded-full blur-[130px] pointer-events-none"></div>
<div class="absolute top-1/2 -right-32 w-[34rem] h-[34rem] bg-amber-600/15 rounded-full blur-[130px] pointer-events-none"></div>

<!-- HEADER NAVIGATION -->
<header class="sticky top-0 z-40 w-full border-b border-rose-900/40 bg-stone-950/70 backdrop-blur-2xl transition-all">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <!-- Brand Logo -->
        <a th:href="@{/home}" class="flex items-center gap-3 group">
            <span class="text-xl font-black tracking-widest uppercase bg-gradient-to-r from-amber-100 via-rose-100 to-amber-300 bg-clip-text text-transparent">
                WANCH
            </span>
            <span class="hidden sm:inline-block text-xs font-semibold px-2.5 py-0.5 rounded-full bg-rose-950/80 border border-rose-700/50 text-rose-200">
                Pairings
            </span>
        </a>

        <!-- Back Link -->
        <a th:href="@{/events(companyId=${company.id})}"
           class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-amber-950/40 hover:bg-amber-900/50 text-amber-200 hover:text-white text-xs font-semibold rounded-full transition-all border border-amber-800/40 hover:border-amber-700/60 shadow-sm backdrop-blur-sm">
            <span class="text-sm leading-none">&larr;</span> Back
        </a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-8 relative z-10">

    <!-- HERO BANNER -->
    <div class="relative overflow-hidden rounded-3xl bg-stone-950/70 backdrop-blur-2xl p-6 sm:p-8 border border-rose-900/40 shadow-2xl shadow-stone-950/80">
        <div class="absolute top-0 right-0 w-64 h-64 bg-rose-800/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-rose-400 block mb-1">Sommelier Curation</span>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-amber-100"
                    th:text="${event != null ? event.eventName : 'Event Pairings'}">Event Pairings</h1>
                <p class="text-xs text-amber-200/60 font-medium mt-1">
                    Matching artisanal cheeses with compatible wine selections for this event.
                </p>
            </div>

            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-rose-950/80 border border-rose-700/50 text-rose-200 text-xs font-bold tracking-widest uppercase shrink-0 shadow-sm">
                <span>🍷</span>
                <span>Active Menu</span>
                <span>🧀</span>
            </div>
        </div>
    </div>

    <!-- PAIRINGS LIST CONTAINER -->
    <div th:if="${compatibleCombinations != null and !compatibleCombinations.isEmpty()}" class="space-y-4">

        <div th:each="entry : ${compatibleCombinations}"
             class="p-5 bg-stone-900/60 hover:bg-stone-900/90 rounded-2xl border border-amber-900/30 hover:border-rose-900/50 transition-all duration-200 space-y-4">

            <!-- WINE HEADER (MAP KEY) -->
            <div class="flex items-center gap-3 border-b border-rose-900/20 pb-3">
                <div class="w-9 h-9 rounded-full bg-rose-950/80 text-rose-200 font-bold text-sm flex items-center justify-center border border-rose-700/50 shadow-inner shrink-0">
                    🍷
                </div>
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-rose-300/80 block">Selected Wine</span>
                    <a th:href="@{/search(wineId=${entry.key.id})}">
                        <h3 class="text-base font-bold text-amber-100" th:text="${entry.key.wineName}">Wine Name</h3>
                    </a>
                </div>
            </div>

            <!-- CHEESES LIST (INNER MAP KEY = CHEESE, VALUE = SCORE) -->
            <div class="space-y-2 pl-2">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400/80 block">Compatible Cheeses:</span>

                <!-- Loop over nested map entries sorted by score (value) descending -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <a th:each="cheeseEntry : ${entry.getValue()}" th:href="@{/search(cheeseId=${cheeseEntry.key.id})}"
                         class="flex items-center justify-between p-3 rounded-xl bg-stone-950/80 border border-amber-900/30">
                            <div class="flex items-center gap-2">
                                <span class="text-xs">🧀</span>
                                <span class="text-xs font-semibold text-amber-100" th:text="${cheeseEntry.key.cheeseName}">Cheese Name</span>
                            </div>
                            <!-- Compatibility Score Badge -->
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-950/80 text-amber-300 border border-amber-700/50"
                                  th:text="${cheeseEntry.value + '% Match'}">
                        95% Match
                    </span>
                    </a>
                </div>
            </div>
        </div>
    </div>

</main>

</body>
</html>
