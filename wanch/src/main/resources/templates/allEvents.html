<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${company != null ? 'Events for ' + company.companyName : 'Company Events'}">Company Events</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Blend of deep red wine, warm cheese gold, and dark plum/violet */
            background: radial-gradient(circle at 15% 20%, #4a0d18 0%, #1e0910 40%, #261609 75%, #12060a 100%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased text-amber-50 selection:bg-rose-900 selection:text-white relative overflow-x-hidden">

<!-- Ambient Soft Lighting Bubbles (Burgundy & Warm Honey) -->
<div class="absolute -top-32 -left-32 w-[34rem] h-[34rem] bg-rose-800/25 rounded-full blur-[130px] pointer-events-none"></div>
<div class="absolute top-1/2 -right-32 w-[34rem] h-[34rem] bg-amber-600/15 rounded-full blur-[130px] pointer-events-none"></div>

<!-- HEADER NAVIGATION -->
<header class="sticky top-0 z-40 w-full border-b border-rose-900/40 bg-stone-950/70 backdrop-blur-2xl transition-all">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <!-- Brand Logo -->
        <a th:href="@{/home}" class="flex items-center gap-3 group">
            <span class="text-xl font-black tracking-widest uppercase bg-gradient-to-r from-amber-100 via-rose-100 to-amber-300 bg-clip-text text-transparent">
                WANCH
            </span>
            <span class="hidden sm:inline-block text-xs font-semibold px-2.5 py-0.5 rounded-full bg-rose-950/80 border border-rose-700/50 text-rose-200">
                Events
            </span>
        </a>
        <a href="javascript:history.back()"
           class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-amber-950/40 hover:bg-amber-900/50 text-amber-200 hover:text-white text-xs font-semibold rounded-full transition-all border border-amber-800/40 hover:border-amber-700/60 shadow-sm backdrop-blur-sm">
            <span class="text-sm leading-none">&larr;</span> Back
        </a>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-8 relative z-10">

    <!-- HERO BANNER -->
    <div class="relative overflow-hidden rounded-3xl bg-stone-950/70 backdrop-blur-2xl p-6 sm:p-8 border border-rose-900/40 shadow-2xl shadow-stone-950/80">
        <div class="absolute top-0 right-0 w-64 h-64 bg-rose-800/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-rose-400 block mb-1">Your Corporate Tastings</span>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-amber-100"
                    th:text="${company != null ? company.companyName : 'Company Events'}">Company Name</h1>
            </div>
        </div>
    </div>

    <!-- EVENTS LIST CONTAINER -->
    <div class="bg-stone-950/70 backdrop-blur-2xl p-6 sm:p-8 rounded-3xl border border-rose-900/40 shadow-2xl shadow-stone-950/80 space-y-6">

        <div class="flex items-center justify-between border-b border-rose-900/30 pb-4">
            <h2 class="text-lg font-bold text-amber-100 tracking-tight flex items-center gap-2">
                <span>Scheduled Events</span>
                <span th:text="${#lists.size(events)}"
                      class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-rose-950/80 text-rose-200 border border-rose-700/50">0</span>
            </h2>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(events)}" class="text-center py-16 space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-stone-900/80 text-amber-200/40 flex items-center justify-center mx-auto border border-amber-900/30">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
            </div>
            <p class="text-sm font-semibold text-amber-200/60">No events created yet.</p>
        </div>

        <!-- Events List -->
        <div th:if="${!#lists.isEmpty(events)}" class="space-y-4">

            <div th:each="event : ${events}"
                 class="p-5 bg-stone-900/60 hover:bg-stone-900/90 rounded-2xl border border-amber-900/30 hover:border-rose-900/50 transition-all duration-200 space-y-3">

                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <!-- Event Details -->
                    <a th:href="@{/eventOf(eventId=${event.id})}">
                        <div class="flex items-center gap-3.5">
                            <div class="w-10 h-10 rounded-full bg-rose-950/80 text-rose-200 font-bold text-sm flex items-center justify-center border border-rose-700/50 shadow-inner shrink-0"
                                 th:text="${company.companyName != null ? #strings.substring(company.companyName, 0, 1).toUpperCase() : 'U'}">
                                U
                            </div>
                            <div>
                                <h4 class="text-base font-bold text-amber-100"
                                    th:text="${event.eventName != null ? event.eventName : 'Untitled Event'}">Event Name</h4>
                                <p class="text-xs text-amber-200/60 font-medium"
                                   th:text="${event.eventDate != null ? #temporals.format(event.eventDate, 'MMMM dd, yyyy') : 'Date Pending'}">Date</p>
                            </div>
                        </div>
                    </a>


                    <!-- Action Buttons to Open Modals -->
                    <div class="flex items-center gap-2.5">
                        <button type="button" th:onclick="'openWineModal(' + ${event.id} + ')'"
                                class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-gradient-to-r from-rose-800 to-rose-700 hover:from-rose-700 hover:to-rose-600 text-white font-medium text-xs rounded-full transition-all duration-200 shadow-md shadow-rose-950/60 border border-rose-500/40">
                            <span>🍷 Wines</span>
                        </button>

                        <button type="button" th:onclick="'openCheeseModal(' + ${event.id} + ')'"
                                class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-amber-950/40 hover:bg-amber-900/50 text-amber-100 font-medium text-xs rounded-full transition-all duration-200 border border-amber-800/50 shadow-sm backdrop-blur-sm">
                            <span>🧀 Cheeses</span>
                        </button>
                    </div>
                </div>

                <!-- CHEESE MODAL FOR EVENT -->
                <div th:id="'cheese-modal-' + ${event.id}" class="fixed inset-0 bg-stone-950/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
                    <div class="bg-stone-950/90 border border-amber-900/40 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl shadow-stone-950/80 space-y-4">
                        <div class="flex justify-between items-center border-b border-rose-900/30 pb-3">
                            <h3 class="text-base font-bold text-amber-100">Paired Cheeses</h3>
                            <button type="button" th:onclick="'closeCheeseModal(' + ${event.id} + ')'" class="text-amber-200/60 hover:text-amber-100 font-bold text-lg">&times;</button>
                        </div>

                        <!-- Empty Cheese State -->
                        <div th:if="${#lists.isEmpty(event.getCheeseList())}" class="text-center py-8 space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-stone-900 text-amber-200/40 flex items-center justify-center mx-auto border border-amber-900/30">
                                🧀
                            </div>
                            <p class="text-xs font-semibold text-amber-200/60">No cheese associated with this event yet.</p>
                        </div>

                        <!-- Cheese List -->
                        <div th:if="${!#lists.isEmpty(event.getCheeseList())}" class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                            <div th:each="cheese : ${event.getCheeseList()}"
                                 class="p-3.5 bg-stone-900/80 rounded-xl border border-amber-900/30 flex items-center justify-between">
                                <span class="text-sm font-semibold text-amber-100"
                                      th:text="${cheese.cheeseName != null ? cheese.cheeseName : 'Anonymous Cheese'}">Cheese Name</span>
                            </div>
                        </div>

                        <div class="pt-2 text-right">
                            <button type="button" th:onclick="'closeCheeseModal(' + ${event.id} + ')'" class="px-4 py-1.5 bg-amber-950/40 hover:bg-amber-900/50 text-amber-200 text-xs font-semibold rounded-full border border-amber-800/40 transition">Close</button>
                        </div>
                    </div>
                </div>

                <!-- WINE MODAL FOR EVENT -->
                <div th:id="'wine-modal-' + ${event.id}" class="fixed inset-0 bg-stone-950/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
                    <div class="bg-stone-950/90 border border-rose-900/40 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl shadow-stone-950/80 space-y-4">
                        <div class="flex justify-between items-center border-b border-rose-900/30 pb-3">
                            <h3 class="text-base font-bold text-amber-100">Paired Wines</h3>
                            <button type="button" th:onclick="'closeWineModal(' + ${event.id} + ')'" class="text-amber-200/60 hover:text-amber-100 font-bold text-lg">&times;</button>
                        </div>

                        <!-- Empty Wine State -->
                        <div th:if="${#lists.isEmpty(event.getWineList())}" class="text-center py-8 space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-stone-900 text-rose-200/40 flex items-center justify-center mx-auto border border-rose-900/30">
                                🍷
                            </div>
                            <p class="text-xs font-semibold text-amber-200/60">No wines associated with this event yet.</p>
                        </div>

                        <!-- Wine List -->
                        <div th:if="${!#lists.isEmpty(event.getWineList())}" class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                            <div th:each="wine : ${event.getWineList()}"
                                 class="p-3.5 bg-stone-900/80 rounded-xl border border-rose-900/30 flex items-center justify-between">
                                <span class="text-sm font-semibold text-amber-100"
                                      th:text="${wine.wineName != null ? wine.wineName : 'Anonymous Wine'}">Wine Name</span>
                                <span class="text-xs text-rose-300/80 font-medium" th:text="${wine.winetype}">Type</span>
                            </div>
                        </div>

                        <div class="pt-2 text-right">
                            <button type="button" th:onclick="'closeWineModal(' + ${event.id} + ')'" class="px-4 py-1.5 bg-amber-950/40 hover:bg-amber-900/50 text-amber-200 text-xs font-semibold rounded-full border border-amber-800/40 transition">Close</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script>
    function openWineModal(id){
        document.getElementById('wine-modal-' + id).classList.remove('hidden');
    }
    function closeWineModal(id){
        document.getElementById('wine-modal-' + id).classList.add('hidden');
    }
    function openCheeseModal(id){
        document.getElementById('cheese-modal-' + id).classList.remove('hidden');
    }
    function closeCheeseModal(id){
        document.getElementById('cheese-modal-' + id).classList.add('hidden');
    }
</script>
</body>
</html>
